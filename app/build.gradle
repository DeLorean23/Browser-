plugins {
    id 'com.android.application'
}

android {
    namespace 'de.delorean23.adblockbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'de.delorean23.adblockbrowser'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // 32-bit ARM (armeabi-v7a)
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Mit dem Debug-Schlüssel signiert, damit die APK direkt installierbar ist
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Kotlin-Versionen angleichen (sonst doppelte Klassen aus kotlin-stdlib-jdk7/jdk8)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
}
