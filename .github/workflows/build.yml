name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android-SDK ist auf ubuntu-latest vorinstalliert
      - name: SDK-Lizenzen bestätigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK bauen (32-bit, armeabi-v7a)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlockBrowser-32bit
          path: app/build/outputs/apk/release/*.apk
