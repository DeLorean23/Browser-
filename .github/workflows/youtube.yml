name: YouTube-App bauen

on:
  push:
    paths:
      - 'youtube/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/youtube.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK-Lizenzen bestätigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APKs bauen (32-bit und 64-bit)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :youtube:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: APKs umbenennen
        run: |
          ls youtube/build/outputs/apk/release/
          cp youtube/build/outputs/apk/release/youtube-armeabi-v7a-release.apk DeLoreanTube-32bit.apk
          cp youtube/build/outputs/apk/release/youtube-arm64-v8a-release.apk DeLoreanTube-64bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeLoreanTube-32bit
          path: DeLoreanTube-32bit.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tube-build-${{ github.run_number }}
          name: DeLorean Tube Build ${{ github.run_number }}
          body: |
            DeLorean Tube – YouTube mit Google-Login, Downloads (MP3/MP4), ohne Werbung, Hintergrund-Wiedergabe, Mini-Player, Shorts und Chromecast.
            DeLoreanTube-32bit.apk = ältere Geräte (armeabi-v7a), DeLoreanTube-64bit.apk = neuere Geräte (arm64-v8a).
            Created by DeLorean23
          files: |
            DeLoreanTube-32bit.apk
            DeLoreanTube-64bit.apk
          make_latest: false

      # Bei Fehlern das Build-Protokoll in den Zweig "build-logs" legen (zum Nachsehen)
      - name: Fehlerprotokoll speichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          tail -c 60000 build-log.txt > /tmp/log.txt || echo "kein Log" > /tmp/log.txt
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . || true
          cp /tmp/log.txt youtube-build-log.txt
          git add -f youtube-build-log.txt
          git commit -m "Build-Log ${{ github.run_number }}"
          git push -f origin build-logs

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DeLoreanTube-32bit

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/emu-test.sh

      - name: Testprotokoll speichern (Zweig test-logs)
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/emu && cp -r emu-out/* /tmp/emu/ 2>/dev/null || echo "kein Ergebnis" > /tmp/emu/leer.txt
          git checkout --orphan test-logs-tmp
          git rm -rqf --cached . || true
          rm -rf emu-out && mkdir emu-out && cp -r /tmp/emu/* emu-out/
          git add -f emu-out
          git commit -qm "Emulator-Test ${{ github.run_number }}"
          git push -f origin HEAD:test-logs
